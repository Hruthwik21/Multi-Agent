services:
  app:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    depends_on: [redis, db]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: polymind
      POSTGRES_PASSWORD: polymind
      POSTGRES_DB: polymind
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata: {}
