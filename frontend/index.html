<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PolyMind v2 — Code Review Council</title>
<link rel="stylesheet" href="/styles.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
</head>
<body>
<header class="topbar">
  <div class="brand">🧠 PolyMind <span class="v2">v2 · Code Review Council</span></div>
  <div class="pills"><span id="statusPill" class="pill">idle</span><span id="costPill" class="pill"></span><span id="latPill" class="pill"></span></div>
</header>
<main class="layout">
  <section class="left">
    <form id="reviewForm">
      <input id="prUrl" type="url" required placeholder="https://github.com/owner/repo/pull/123" />
      <textarea id="diffInput" rows="5" placeholder="…or paste a unified diff here (works offline, no token needed)"></textarea>
      <label class="row"><input id="postGh" type="checkbox" /> Post comment to GitHub (needs GITHUB_TOKEN)</label>
      <button type="submit">Review PR</button>
    </form>
    <div id="progress" class="progress"></div>
    <h3>Diff</h3>
    <pre id="diffView" class="diff">Paste a PR URL or diff to begin.</pre>
  </section>
  <section class="right">
    <div class="row space"><h3>Findings</h3><label><input id="onlyVerified" type="checkbox" /> Show only verified</label></div>
    <div id="claims"></div>
    <h3>Final comment</h3>
    <pre id="comment"></pre>
    <button id="copyBtn">Copy final comment</button>
  </section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
